<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ReservaYa</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 18px;
    text-align: center;
}

header h1 {
    margin: 0;
}

.contenedor {
    max-width: 650px;
    margin: auto;
    padding: 20px;
}

.tarjeta {
    background: white;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.oculto {
    display: none !important;
}

h2 {
    margin-top: 0;
}

input,
select,
textarea {
    width: 100%;
    padding: 13px;
    margin-top: 6px;
    margin-bottom: 14px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
}

textarea {
    min-height: 90px;
}

button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    margin-top: 8px;
    font-size: 16px;
    cursor: pointer;
}

.boton {
    background: #111827;
    color: white;
}

.secundario {
    background: #e5e7eb;
    color: #111827;
}

.negocio {
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    cursor: pointer;
}

.negocio:hover {
    background: #f9fafb;
}

.negocio h3 {
    margin: 0 0 6px;
}

.servicio {
    background: #f3f4f6;
    padding: 14px;
    border-radius: 12px;
    margin-bottom: 10px;
}

.reserva {
    border: 1px solid #ddd;
    padding: 14px;
    border-radius: 12px;
    margin-bottom: 12px;
}

.exito {
    color: #087f23;
    font-weight: bold;
}

.error {
    color: #b00020;
    font-weight: bold;
}

.mensaje {
    margin-top: 12px;
    text-align: center;
}

.pequeno {
    color: #666;
    font-size: 14px;
}

.cargando {
    text-align: center;
    color: #666;
    padding: 15px;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<header>
    <h1>📅 ReservaYa</h1>
    <p>Reserva servicios de tus negocios favoritos</p>
</header>

<div class="contenedor">

    <!-- INICIO -->

    <div id="inicio" class="tarjeta">

        <h2>Bienvenido</h2>

        <p>
            Reserva citas y servicios de diferentes negocios
            desde un solo lugar.
        </p>

        <button
            class="boton"
            onclick="mostrar('login')"
        >
            Iniciar sesión
        </button>

        <button
            class="secundario"
            onclick="mostrar('registro')"
        >
            Crear una cuenta
        </button>

    </div>


    <!-- REGISTRO -->

    <div id="registro" class="tarjeta oculto">

        <h2>Crear cuenta</h2>

        <label>Nombre</label>

        <input
            id="registroNombre"
            type="text"
            placeholder="Tu nombre"
        >

        <label>Correo</label>

        <input
            id="registroEmail"
            type="email"
            placeholder="tu@email.com"
        >

        <label>Contraseña</label>

        <input
            id="registroPassword"
            type="password"
            placeholder="Contraseña"
        >

        <button
            class="boton"
            onclick="crearCuenta()"
        >
            Registrarme
        </button>

        <button
            class="secundario"
            onclick="mostrar('inicio')"
        >
            Volver
        </button>

        <div id="mensajeRegistro" class="mensaje"></div>

    </div>


    <!-- LOGIN -->

    <div id="login" class="tarjeta oculto">

        <h2>Iniciar sesión</h2>

        <label>Correo</label>

        <input
            id="loginEmail"
            type="email"
            placeholder="tu@email.com"
        >

        <label>Contraseña</label>

        <input
            id="loginPassword"
            type="password"
            placeholder="Contraseña"
        >

        <button
            class="boton"
            onclick="iniciarSesion()"
        >
            Iniciar sesión
        </button>

        <button
            class="secundario"
            onclick="mostrar('inicio')"
        >
            Volver
        </button>

        <div id="mensajeLogin" class="mensaje"></div>

    </div>


    <!-- CLIENTE -->

    <div id="cliente" class="oculto">

        <div class="tarjeta">

            <h2>
                👋 Hola,
                <span id="nombreCliente"></span>
            </h2>

            <p>
                Elige un negocio para reservar.
            </p>

            <button
                class="secundario"
                onclick="cerrarSesion()"
            >
                Cerrar sesión
            </button>

        </div>


        <!-- NEGOCIOS -->

        <div class="tarjeta">

            <h2>🏢 Negocios</h2>

            <div id="listaNegocios">

                <div class="cargando">
                    Cargando negocios...
                </div>

            </div>

            <div
                id="mensajeNegocios"
                class="mensaje"
            ></div>

        </div>


        <!-- NEGOCIO SELECCIONADO -->

        <div
            id="zonaNegocio"
            class="tarjeta oculto"
        >

            <h2 id="nombreNegocio"></h2>

            <p
                id="idNegocioMostrado"
                class="pequeno"
            ></p>

            <h3>Servicios</h3>

            <div id="listaServicios"></div>


            <h3>Reservar</h3>

            <label>Servicio</label>

            <select id="servicioReserva">

                <option value="">
                    Selecciona un servicio
                </option>

            </select>


            <label>Fecha</label>

            <input
                id="fechaReserva"
                type="date"
            >


            <label>Hora</label>

            <select id="horaReserva">

                <option value="">
                    Selecciona una hora
                </option>

                <option value="09:00">09:00</option>
                <option value="10:00">10:00</option>
                <option value="11:00">11:00</option>
                <option value="12:00">12:00</option>
                <option value="13:00">13:00</option>
                <option value="14:00">14:00</option>
                <option value="15:00">15:00</option>
                <option value="16:00">16:00</option>
                <option value="17:00">17:00</option>
                <option value="18:00">18:00</option>

            </select>


            <label>Comentario</label>

            <textarea
                id="comentarioReserva"
                placeholder="Algo que quieras decirle al negocio"
            ></textarea>


            <button
                class="boton"
                onclick="reservar()"
            >
                Confirmar reserva
            </button>


            <div
                id="mensajeReserva"
                class="mensaje"
            ></div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://mjxiyzapdybzckurootw.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_Ox1Wz7UT2Gw6uHOP6SncjQ_sGapEEB-";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


let usuarioActual = null;
let negocioActual = null;


/* =========================================================
   CAMBIAR PANTALLA
   ========================================================= */

function mostrar(id) {

    const secciones = [
        "inicio",
        "registro",
        "login",
        "cliente"
    ];

    secciones.forEach(function(seccion) {

        const elemento =
            document.getElementById(seccion);

        if (elemento) {
            elemento.classList.add("oculto");
        }

    });


    const destino =
        document.getElementById(id);

    if (destino) {
        destino.classList.remove("oculto");
    }

}


/* =========================================================
   REGISTRO
   ========================================================= */

async function crearCuenta() {

    const nombre =
        document
            .getElementById("registroNombre")
            .value
            .trim();

    const email =
        document
            .getElementById("registroEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("registroPassword")
            .value;

    const mensaje =
        document.getElementById("mensajeRegistro");


    if (!nombre || !email || !password) {

        mensaje.textContent =
            "Completa todos los campos.";

        mensaje.className =
            "mensaje error";

        return;
    }


    if (password.length < 6) {

        mensaje.textContent =
            "La contraseña debe tener mínimo 6 caracteres.";

        mensaje.className =
            "mensaje error";

        return;
    }


    mensaje.textContent =
        "Creando cuenta...";

    mensaje.className =
        "mensaje";


    const resultado =
        await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

                data: {
                    nombre: nombre
                }

            }

        });


    if (resultado.error) {

        console.error(
            "ERROR REGISTRO:",
            resultado.error
        );

        mensaje.textContent =
            "Error: " +
            resultado.error.message;

        mensaje.className =
            "mensaje error";

        return;
    }


    mensaje.textContent =
        "✅ Cuenta creada correctamente.";

    mensaje.className =
        "mensaje exito";


    document
        .getElementById("loginEmail")
        .value = email;


    setTimeout(function() {

        mostrar("login");

    }, 1000);

}


/* =========================================================
   LOGIN
   ========================================================= */

async function iniciarSesion() {

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;

    const mensaje =
        document.getElementById("mensajeLogin");


    if (!email || !password) {

        mensaje.textContent =
            "Completa correo y contraseña.";

        mensaje.className =
            "mensaje error";

        return;
    }


    mensaje.textContent =
        "Iniciando sesión...";

    mensaje.className =
        "mensaje";


    const resultado =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


    console.log(
        "RESULTADO LOGIN:",
        resultado
    );


    if (resultado.error) {

        mensaje.textContent =
            "Error: " +
            resultado.error.message;

        mensaje.className =
            "mensaje error";

        return;
    }


    usuarioActual =
        resultado.data.user;


    const nombre =
        usuarioActual.user_metadata?.nombre ||
        usuarioActual.email;


    document
        .getElementById("nombreCliente")
        .textContent =
            nombre;


    mensaje.textContent =
        "✅ Sesión iniciada correctamente.";

    mensaje.className =
        "mensaje exito";


    setTimeout(async function() {

        mostrar("cliente");

        await cargarNegocios();

    }, 500);

}


/* =========================================================
   CARGAR NEGOCIOS DESDE SUPABASE
   ========================================================= */

async function cargarNegocios() {

    const lista =
        document.getElementById("listaNegocios");

    const mensaje =
        document.getElementById("mensajeNegocios");


    lista.innerHTML =
        "<div class='cargando'>Cargando negocios...</div>";

    mensaje.textContent = "";


    console.log(
        "🔎 BUSCANDO NEGOCIOS EN SUPABASE..."
    );


    const resultado =
        await supabaseClient
            .from("negocios")
            .select("id, nombre")
            .order("nombre");


    console.log(
        "📦 RESULTADO NEGOCIOS:",
        resultado
    );


    if (resultado.error) {

        console.error(
            "❌ ERROR NEGOCIOS:",
            resultado.error
        );


        lista.innerHTML = "";


        mensaje.textContent =
            "Error cargando negocios: " +
            resultado.error.message;

        mensaje.className =
            "mensaje error";

        return;
    }


    const negocios =
        resultado.data;


    console.log(
        "🏢 NEGOCIOS ENCONTRADOS:",
        negocios
    );


    if (!negocios || negocios.length === 0) {

        lista.innerHTML =
            "<p class='error'>" +
            "No hay negocios registrados en Supabase." +
            "</p>";

        return;
    }


    lista.innerHTML = "";


    negocios.forEach(function(negocio) {

        const tarjeta =
            document.createElement("div");


        tarjeta.className =
            "negocio";


        tarjeta.innerHTML =

            "<h3>🏢 " +
            escaparHTML(negocio.nombre) +
            "</h3>" +

            "<p>" +
            "Toca para ver sus servicios." +
            "</p>";


        tarjeta.onclick =
            function() {

                seleccionarNegocio(negocio);

            };


        lista.appendChild(tarjeta);

    });

}


/* =========================================================
   SELECCIONAR NEGOCIO
   ========================================================= */

async function seleccionarNegocio(negocio) {

    negocioActual =
        negocio;


    console.log(
        "🏢 NEGOCIO SELECCIONADO:",
        negocio
    );


    document
        .getElementById("zonaNegocio")
        .classList
        .remove("oculto");


    document
        .getElementById("nombreNegocio")
        .textContent =
            negocio.nombre;


    document
        .getElementById("idNegocioMostrado")
        .textContent =
            "ID: " + negocio.id;


    const lista =
        document.getElementById("listaServicios");


    const selector =
        document.getElementById("servicioReserva");


    lista.innerHTML =
        "<div class='cargando'>Cargando servicios...</div>";


    selector.innerHTML =

        "<option value=''>" +
        "Cargando servicios..." +
        "</option>";


    document
        .getElementById("mensajeReserva")
        .textContent = "";


    console.log(
        "🔎 BUSCANDO SERVICIOS PARA NEGOCIO:",
        negocio.id
    );


    const resultado =
        await supabaseClient
            .from("servicios")
            .select("id, nombre, precio, duracion, negocio_id")
            .eq("negocio_id", negocio.id)
            .order("nombre");


    console.log(
        "📦 RESULTADO SERVICIOS:",
        resultado
    );


    if (resultado.error) {

        console.error(
            "❌ ERROR SERVICIOS:",
            resultado.error
        );


        lista.innerHTML =
            "<p class='error'>" +
            "Error al cargar servicios: " +
            escaparHTML(resultado.error.message) +
            "</p>";


        selector.innerHTML =
            "<option value=''>" +
            "Error cargando servicios" +
            "</option>";


        return;
    }


    const servicios =
        resultado.data;


    console.log(
        "🛠️ SERVICIOS ENCONTRADOS:",
        servicios
    );


    if (!servicios || servicios.length === 0) {

        lista.innerHTML =
            "<p class='error'>" +
            "Este negocio no tiene servicios registrados " +
            "con este negocio_id." +
            "</p>";


        selector.innerHTML =
            "<option value=''>" +
            "No hay servicios disponibles" +
            "</option>";


        return;
    }


    lista.innerHTML = "";


    selector.innerHTML =

        "<option value=''>" +
        "Selecciona un servicio" +
        "</option>";


    servicios.forEach(function(servicio) {

        const div =
            document.createElement("div");


        div.className =
            "servicio";


        let precioTexto =
            "Reserva";


        if (
            servicio.precio !== null &&
            servicio.precio !== undefined &&
            Number(servicio.precio) > 0
        ) {

            precioTexto =
                "$" +
                Number(servicio.precio)
                    .toLocaleString("es-CO");

        }


        div.innerHTML =

            "<strong>" +
            escaparHTML(servicio.nombre) +
            "</strong><br>" +

            precioTexto +
            "<br>" +

            "<span class='pequeno'>" +

            (
                servicio.duracion
                    ? escaparHTML(
                        String(servicio.duracion)
                      ) +
                      " minutos"
                    : "Duración no especificada"
            ) +

            "</span>";


        lista.appendChild(div);


        const opcion =
            document.createElement("option");


        opcion.value =
            servicio.id;


        opcion.textContent =
            servicio.nombre +
            (
                Number(servicio.precio) > 0
                    ? " - $" +
                      Number(servicio.precio)
                        .toLocaleString("es-CO")
                    : ""
            );


        selector.appendChild(opcion);

    });

}


/* =========================================================
   RESERVAR
   ========================================================= */

async function reservar() {

    const servicioId =
        document
            .getElementById("servicioReserva")
            .value;


    const fecha =
        document
            .getElementById("fechaReserva")
            .value;


    const hora =
        document
            .getElementById("horaReserva")
            .value;


    const comentario =
        document
            .getElementById("comentarioReserva")
            .value
            .trim();


    const mensaje =
        document.getElementById("mensajeReserva");


    if (!negocioActual) {

        mensaje.textContent =
            "Selecciona un negocio.";

        mensaje.className =
            "mensaje error";

        return;
    }


    if (!servicioId) {

        mensaje.textContent =
            "Selecciona un servicio.";

        mensaje.className =
            "mensaje error";

        return;
    }


    if (!fecha) {

        mensaje.textContent =
            "Selecciona una fecha.";

        mensaje.className =
            "mensaje error";

        return;
    }


    if (!hora) {

        mensaje.textContent =
            "Selecciona una hora.";

        mensaje.className =
            "mensaje error";

        return;
    }


    if (!usuarioActual) {

        mensaje.textContent =
            "Debes iniciar sesión.";

        mensaje.className =
            "mensaje error";

        return;
    }


    mensaje.textContent =
        "Guardando reserva...";

    mensaje.className =
        "mensaje";


    const nombreCliente =
        usuarioActual.user_metadata?.nombre ||
        usuarioActual.email;

console.log("USUARIO ACTUAL ID:", usuarioActual?.id);
console.log("USUARIO ACTUAL:", usuarioActual);
    alert("ID DEL USUARIO:\n" + usuarioActual?.id);   
    const datosReserva = {

    negocio_id:
        negocioActual.id,

    servicio_id:
        servicioId,

    usuario:
    usuarioActual.id,

    nombre_cliente:
        nombreCliente,

    telefono_cliente:
        "",

    fecha:
        fecha,

    hora:
        hora,

    comentario:
        comentario,

    estado:
        "Pendiente"

};

    console.log(
        "📅 DATOS DE RESERVA:",
        datosReserva
    );


    const resultado =
        await supabaseClient
            .from("Citas")
            .insert([datosReserva])
            .select();


    console.log(
        "📦 RESULTADO RESERVA:",
        resultado
    );


    if (resultado.error) {

        console.error(
            "❌ ERROR GUARDANDO RESERVA:",
            resultado.error
        );


        mensaje.textContent =
            "Error al guardar la reserva: " +
            resultado.error.message;

        mensaje.className =
            "mensaje error";

        return;
    }


    mensaje.textContent =
        "✅ Reserva realizada correctamente.";

    mensaje.className =
        "mensaje exito";


    document
        .getElementById("servicioReserva")
        .value = "";


    document
        .getElementById("fechaReserva")
        .value = "";


    document
        .getElementById("horaReserva")
        .value = "";


    document
        .getElementById("comentarioReserva")
        .value = "";

}


/* =========================================================
   CERRAR SESIÓN
   ========================================================= */

async function cerrarSesion() {

    await supabaseClient.auth.signOut();

    usuarioActual = null;

    negocioActual = null;

    mostrar("inicio");

}


/* =========================================================
   SEGURIDAD BÁSICA PARA TEXTO MOSTRADO EN HTML
   ========================================================= */

function escaparHTML(texto) {

    if (texto === null || texto === undefined) {
        return "";
    }


    return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   COMPROBAR SESIÓN AL CARGAR
   ========================================================= */

async function comprobarSesion() {

    const resultado =
        await supabaseClient.auth.getSession();


    if (
        resultado.data &&
        resultado.data.session &&
        resultado.data.session.user
    ) {

        usuarioActual =
            resultado.data.session.user;


        const nombre =
            usuarioActual.user_metadata?.nombre ||
            usuarioActual.email;


        document
            .getElementById("nombreCliente")
            .textContent =
                nombre;


        mostrar("cliente");

        await cargarNegocios();

    } else {

        mostrar("inicio");

    }

}


/* =========================================================
   INICIO
   ========================================================= */

comprobarSesion();

</script>

</body>
</html>
